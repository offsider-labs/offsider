[project]
name = "offsider"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "dvk", email = "davidvankriedt@icloud.com" }
]
requires-python = ">=3.12"
dependencies = [
    "easyocr>=1.7.2",
    "python-dotenv>=1.2.4",
    "roboflow>=1.7.1",
    "streamlit>=1.66.1",
    "streamlit-webrtc>=0.79.0",
    "ultralytics>=8.4.175",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
